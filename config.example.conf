# cc-limits-statusline — configuration
#
# Copy this file to ~/.config/cc-limits-statusline.conf and edit it. The
# statusline sources it on every refresh, so changes take effect immediately
# (no restart). Override the path with the CC_STATUSLINE_RC env var.
#
# This is sourced as bash, so it is just `NAME=value` lines (no spaces around
# the =). Anything you leave commented out keeps its built-in default.

# ── Colour thresholds (percentages of the worst-of-two limit) ───────────────
#   < YELLOW_AT          🟢 ●   green   — plenty of headroom, not paying
#   YELLOW_AT..RED_AT-1  🟡 ●   yellow  — getting close to the limit
#   RED_AT..DOUBLE_AT-1  🔴 ●   red     — at the limit → paid overage active
#   >= DOUBLE_AT         🔴 ●●  red     — well over the limit, paid overage active
#YELLOW_AT=80
#RED_AT=100
#DOUBLE_AT=120

# ── Context-window thresholds (when to run /compact, not billing) ────────────
# The ctx % is coloured to nudge you to /compact before Claude Code auto-compacts
# a nearly-full window:
#   < CTX_YELLOW_AT   🟢 green   — plenty of room, no need to compact
#   ..CTX_RED_AT-1    🟡 yellow  — good time to /compact at a natural breakpoint
#   >= CTX_RED_AT     🔴 red     — compact now, auto-compact is imminent
#CTX_YELLOW_AT=70
#CTX_RED_AT=85

# ── Field visibility (1 = show, 0 = hide) ───────────────────────────────────
# These are the fields shown by default, in display order. Set any to 0 to hide
# it (its │ separator is dropped too).
#SHOW_CWD=1      # ~/dev/myproject — current working directory
#SHOW_PLAN=1     # [Max 20x]       — subscription plan
#SHOW_MODEL=1    # Claude Opus 4.8 — active model
#SHOW_5H=1       # 5h 42% (3h 12m) — 5-hour session window
#SHOW_7D=1       # 7d 18% (5d 4h)  — 7-day weekly window
#SHOW_CTX=1      # ctx 31%         — context window used
#SHOW_EXTRA=1    # Extra-Usage: ON ● — overage state + status dot
#SHOW_COST=1     # 💳 $0.00        — current-session cost
