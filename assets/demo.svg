  <text x="24" y="74" fill="#c9d1d9" xml:space="preserve"><tspan fill="#58a6ff" font-weight="bold">~/dev/myproject </tspan><tspan fill="#d2a8ff" font-weight="bold">[Pro]</tspan> Claude Opus 4.8 <tspan fill="#6e7681">│ </tspan>5h <tspan fill="#3fb950">12% </tspan><tspan fill="#6e7681">(4h 1m) │ </tspan>7d <tspan fill="#3fb950">7% </tspan><tspan fill="#6e7681">(6d 2h) │ ctx 18% │ </tspan>Extra-Usage: OFF <tspan fill="#6e7681">│ </tspan>💳 $0.00</text>

  <!-- line 2 — extra usage ON, worst limit < 80% -> green dot (plenty of headroom) -->
  <text x="24" y="114" fill="#c9d1d9" xml:space="preserve"><tspan fill="#58a6ff" font-weight="bold">~/code/web </tspan><tspan fill="#d2a8ff" font-weight="bold">[Max 20x]</tspan> Claude Opus 4.8 <tspan fill="#6e7681">│ </tspan>5h <tspan fill="#3fb950">42% </tspan><tspan fill="#6e7681">(3h 12m) │ </tspan>7d <tspan fill="#3fb950">18% </tspan><tspan fill="#6e7681">(5d 4h) │ ctx 31% │ </tspan>Extra-Usage: ON <tspan fill="#3fb950">●</tspan> <tspan fill="#6e7681">│ </tspan>💳 $0.00</text>

